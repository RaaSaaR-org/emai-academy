# Publishes the four EmAI Academy images the Helm chart in RaaSaaR-org/deployments pulls:
#   ghcr.io/raasaar-org/emai-academy-{web,backend,skills,services}
#
# The chart pins an explicit CalVer tag, so a release is a deliberate tag (vYYYY.MM.DD.N),
# not whatever main happens to be. Pushes to main publish `main-<sha>` tags for pre-release
# testing only. All four images of a release share one tag.
#
# Upstream Bootstrap Academy sources are fetched inside the Dockerfiles at the commits pinned
# there (BACKEND_REF, FRONTEND_REF, SKILLS_REF build args); bump them in the Dockerfiles.
name: images

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to publish (CalVer, e.g. 2026.10.01.1)'
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  # Public origin baked into the web image (API base URL, lesson module URLs) and into the
  # skills image's lesson module descriptors. Both must match.
  PUBLIC_ORIGIN: https://academy.emai.dev

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required to push to ghcr.io under the org.
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [web, backend, skills, services]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/raasaar-org/emai-academy-${{ matrix.image }}
          tags: |
            # main-<short sha>, see vr-headquarter/.github/workflows/image.yml for why not
            # type=ref,event=branch with a prefix.
            type=sha,prefix=main-,format=short,enable={{is_default_branch}}
            # CalVer is not semver: take the tag verbatim, minus the `v`.
            type=match,pattern=v(.*),group=1
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.image }}/Dockerfile
          build-args: |
            PUBLIC_ORIGIN=${{ env.PUBLIC_ORIGIN }}
          # The Talos nodes are amd64.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
