<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="dark" />
<title>{{ title }}</title>
<!-- EmAI Academy mail layout (used by services/mail-relay). No external images, fonts or
     tracking: opening the mail makes no request to any server. -->
<style>
  body { margin: 0; padding: 0; background: #141414; color: #F5F5F4; }
  .wrap { width: 100%; background: #141414; padding: 32px 0; }
  .card { max-width: 560px; margin: 0 auto; background: #1F1F1F; border: 1px solid #2E2E2E; border-radius: 8px; }
  .head { padding: 24px 32px; border-bottom: 1px solid #2E2E2E; font-family: "Space Grotesk", Arial, sans-serif; font-size: 18px; font-weight: 700; letter-spacing: 0.2px; }
  .head .ai { color: #FF6700; }
  .head .sub { color: #A8A29E; font-weight: 400; }
  .body { padding: 28px 32px 8px; font-family: Geist, -apple-system, "Segoe UI", Arial, sans-serif; font-size: 15px; line-height: 1.6; color: #E7E5E4; }
  .body h1 { font-family: "Space Grotesk", Arial, sans-serif; font-size: 22px; line-height: 1.3; margin: 0 0 16px; color: #F5F5F4; }
  .body p { margin: 0 0 16px; }
  .body a { color: #2DD4BF; }
  .btn { display: inline-block; background: #FF6700; color: #141414 !important; text-decoration: none; font-weight: 700; padding: 12px 22px; border-radius: 4px; }
  .code { font-family: "Geist Mono", Menlo, Consolas, monospace; font-size: 26px; letter-spacing: 4px; color: #FF6700; background: #141414; border: 1px solid #2E2E2E; border-radius: 6px; padding: 12px 18px; display: inline-block; }
  .muted { color: #A8A29E; font-size: 13px; }
  .sign { padding: 0 32px 24px; font-family: Geist, Arial, sans-serif; font-size: 15px; color: #E7E5E4; }
  .foot { max-width: 560px; margin: 16px auto 0; padding: 0 32px; font-family: Geist, Arial, sans-serif; font-size: 12px; line-height: 1.6; color: #A8A29E; }
  .foot a { color: #A8A29E; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="head">Em<span class="ai">AI</span> Academy <span class="sub">· Souveräne Physical AI für Unternehmen</span></div>
    <div class="body">
{{ content }}
    </div>
    <div class="sign">Ihr Team der EmAI Academy</div>
  </div>
  <div class="foot">
    <p>Fragen? Schreiben Sie uns: <a href="mailto:info@EmAI.dev">info@EmAI.dev</a></p>
    <p>EmAI Robotics GmbH · Halbergstraße 4 · 66121 Saarbrücken<br />
      <a href="{{ web_url }}/docs/imprint">Impressum</a> · <a href="{{ web_url }}/docs/privacy">Datenschutz</a> · <a href="{{ web_url }}/docs/terms-and-conditions">Nutzungsbedingungen</a></p>
    <p>Selbst getestet · Herstellerunabhängig · Offen geteilt</p>
  </div>
</div>
</body>
</html>
